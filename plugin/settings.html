<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/settings.css"></head>
<body>
<div class="wrap">
<div class="status" id="status-bar">
  <span class="st" data-status="jev"><i class="dot unknown" id="status-jev-dot"></i>Jev 凭证<span class="v" id="status-jev-value"></span></span>
  <span class="st" data-status="catalog"><i class="dot unknown" id="status-catalog-dot"></i>模型清单<span class="v" id="status-catalog-value"></span></span>
  <span class="st" data-status="hooks"><i class="dot unknown" id="status-hooks-dot"></i>收工拦截<span class="v" id="status-hooks-value"></span></span>
  <span class="st" data-status="clock"><i class="dot unknown" id="status-clock-dot"></i>后台时钟<span class="v" id="status-clock-value"></span></span>
</div>

<section class="models">
  <div class="head">
    <h2>KEEL 设置</h2>
    <div class="tabs" id="model-tabs" role="tablist">
      <button type="button" class="on" data-harness="claude-code" role="tab" aria-selected="true">我用 Claude Code 时</button>
      <button type="button" data-harness="codex" role="tab" aria-selected="false">我用 Codex 时</button>
    </div>
  </div>
  <p class="config-note">这里只决定 KEEL 怎么派活，不会改你当前会话的模型。</p>
  <div class="card" id="model-rows"></div>
  <p id="stage-notice" role="status"></p>
  <div class="bar">
    <p id="manual-status" role="status"></p>
    <button type="button" class="btn pri" data-act="save" disabled>保存</button>
  </div>
</section>

<div class="card">
  <div class="row reply-row">
    <div class="role"><b>评审回帖</b><span>回复 PR 评审线程</span></div>
    <div class="seg2" id="reply-seg">
      <button type="button" data-reply="auto">自动发送</button>
      <button type="button" data-reply="confirm">每条确认</button>
    </div>
  </div>
</div>
<p id="reply-status" role="status"></p>

<div class="accs">
<details id="accordion-jev">
  <summary>Jev 凭证<span id="jev-summary">更换或清除 ›</span></summary>
  <div class="acc-body">
    <form id="form"><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Typesafe API Key" aria-label="Typesafe API Key"><button type="submit" class="btn">保存</button><button type="button" class="btn" id="clear">清除</button></form>
    <p id="status" role="status"></p>
    <p class="hint">Key 只存主机保险库，插件和 AI 拿不到明文。<a href="https://console.typesafe.ai/home">Typesafe 控制台 ↗</a></p>
  </div>
</details>

<details id="accordion-lanes">
  <summary>本机车道<span id="lanes-summary">只读 ›</span></summary>
  <div class="acc-body">
    <div id="lanes"></div>
    <p class="hint">只读：来自本机配置，改完需重新构建安装。</p>
  </div>
</details>

<details id="accordion-advanced">
  <summary>高级<span>导入导出 · 恢复默认 ›</span></summary>
  <div class="acc-body" id="advanced-body">
    <div class="adv-row">
      <button type="button" data-act="export">导出 JSON</button>
      <button type="button" data-act="import">导入 JSON</button>
      <span class="sep"></span>
      <button type="button" data-act="restore">恢复默认</button>
    </div>
  </div>
</details>
</div>
</div>
<input id="manual-file" type="file" accept="application/json" hidden>
<script src="/settings.js"></script>
</body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="/settings.css"></head>
<body>
<p>Keel 用 Typesafe Jev 做判断。API Key 只交给主机保险库，插件和 AI 都拿不到明文。</p>
<form id="form"><label for="key">Typesafe API Key</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="输入 API Key">
<div><button type="submit">保存凭证</button><button type="button" id="clear">清除凭证</button></div></form>
<p id="status" role="status"></p>
<a href="https://console.typesafe.ai/home">前往 Typesafe 控制台</a>
<h3>车道与派工路由</h3>
<div id="lanes"></div>
<p class="hint">以上来自本机个人配置（构建时注入，改配置后重新构建安装）。</p>
<h3>当前派工路由</h3>
<div><select id="roles-lead"><option value="claude-code">lead：Claude Code</option><option value="codex">lead：Codex</option><option value="pi">lead：Pi</option></select><button type="button" id="roles-refresh">现读 routing.json</button></div>
<div id="roles"></div>
<script src="/settings.js"></script></body></html>
